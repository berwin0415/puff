<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>puff - 启动失败</title>
    <style>
    :root {
      color-scheme: dark;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #0b1020;
      color: #e9edf7;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(215, 72, 97, 0.25), transparent 34rem), #0b1020;
    }

    main {
      width: min(42rem, calc(100vw - 4rem));
    }

    .eyebrow {
      margin: 0 0 0.6rem;
      color: #ff9aad;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.7rem;
    }

    .message,
    .logs {
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      color: #c6cee1;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .logs {
      margin-top: 0.75rem;
      color: #8f9ab3;
      font-size: 0.85rem;
    }

    nav {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    a {
      padding: 0.7rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0.6rem;
      color: #e9edf7;
      background: rgba(255, 255, 255, 0.06);
      text-decoration: none;
    }

    a.primary {
      border-color: #4d6bfe;
      background: #4d6bfe;
    }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">puff</p>
      <h1>无法启动 DeepSeek Harness</h1>
      <div class="message" id="message">未知错误</div>
      <div class="logs" id="logs">日志目录：</div>
      <nav>
        <a class="primary" href="puff-action://retry">重试</a>
        <a href="puff-action://restart">重启 Host</a>
        <a href="puff-action://open-logs">打开日志</a>
        <a href="puff-action://quit">退出 puff</a>
      </nav>
    </main>
    <script>
    const params = new URLSearchParams(window.location.search);
    document.querySelector('#message').textContent = params.get('message') || '未知错误';
    document.querySelector('#logs').textContent = `日志目录：${params.get('logs') || '-'}`;
    </script>
  </body>
</html>
