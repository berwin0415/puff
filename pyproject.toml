[project]
name = "harness-lab"
version = "0.1.0"
description = "Local validation harness for comparing open-source Agent frameworks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docker>=7.1,<8",
  "httpx>=0.27,<1",
  "playwright>=1.50,<2",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
