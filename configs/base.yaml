schema_version: 1
runner:
  event_schema_version: 1
  storage:
    sqlite_path: var/state/harness.db
    event_root_env: HARNESS_LAB_EVENT_ROOT
  artifact_root_env: HARNESS_LAB_ARTIFACT_ROOT
  default_timeout_seconds: 300
  default_budget_usd: 1.0
  pause:
    mode: safe_point
    checkpoint_required: true
    side_effect_policy: idempotency_key
model:
  provider: remote_api
  base_url_env: MODEL_API_BASE_URL
  api_key_env: MODEL_API_KEY
  model_env: MODEL_NAME
browser:
  primary_track: execution_playwright
  engine: chromium
  headless: true
