schema_version: 1

paths:
  data_root: /Users/hanbowen01/harness-lab-data
  container_data_root: /data

# 此处仅保存变量名；值在运行时注入，不在这里读取。
model:
  api_base_url_env: MODEL_API_BASE_URL
  api_key_env: MODEL_API_KEY
  name_env: MODEL_NAME

budget:
  active_timeout_seconds: 300
  max_model_calls: 20
  max_retries: 2
  pause_wait_seconds: 600
  budget_usd_reference: 1.0
  # 尚未实现价格信息和实际金额限额。
  usd_limit_enforced: false
  price_source: null

seeds:
  smoke: [101]
  validation: [101, 202, 303]
  final: [101, 202, 303, 404, 505]

concurrency:
  max_active_tasks: 2
  idle_user_counts: [2, 5, 10]

# 单次实验全部服务的总资源预算，不是每个容器的配额。
resources:
  memory_bytes: 6442450944
  cpus: 3

sampling:
  interval_seconds: 2

execution_policy:
  ordinary_operations: auto_within_scope
  sensitive_operations: deny
  human_approval: false
