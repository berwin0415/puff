task_id: t5-fault-recovery
category: fault_recovery
description: Inject a failed tool call, a process exit and a repeated submission, then verify retry and recovery invariants.
timeout_seconds: 600
budget_usd: 1.0
grader: recovery_invariants
side_effects: idempotent_fixture
faults:
  - fail_once_fixture
  - runner_restart
  - duplicate_submit
assertions:
  - the first injected failure is retried and observable
  - recovery reuses the existing run_id and checkpoint
  - repeated side effects are replayed instead of duplicated
  - terminal state and failure reason are recorded
