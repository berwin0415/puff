task_id: t4-pause-resume
category: pause_resume
description: Pause an in-flight task, persist a checkpoint, restart the runner and resume the same task.
timeout_seconds: 600
budget_usd: 1.0
grader: state_consistency
side_effects: idempotent_fixture
checkpoint:
  safe_point: after_inflight_call
  require_runner_restart: true
  compare_against_baseline: true
assertions:
  - messages and tool context are restored from the checkpoint
  - workspace files match the pre-pause baseline
  - no duplicate external side effects after resume
  - event sequence continues without gaps or duplicates
