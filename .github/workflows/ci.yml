name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v3

      - name: Restore pnpm store and Nx cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            .nx/cache
          key: ${{ runner.os }}-pnpm-nx-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-nx-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Nx affected base and head
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Check project boundaries
        run: node tools/checks/project-boundaries.mjs

      - name: Affected projects
        if: github.event_name != 'schedule'
        run: pnpm exec nx affected -t lint typecheck test build

      - name: Full run without cache
        if: github.event_name == 'schedule'
        run: pnpm exec nx run-many -t lint typecheck test build --skip-nx-cache

      - name: Save pnpm store and Nx cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            .nx/cache
          key: ${{ runner.os }}-pnpm-nx-${{ hashFiles('pnpm-lock.yaml') }}
