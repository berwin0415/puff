[project]
name = "harness-lab-openai-agents-sdk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.24.0",
    # 匹配与固定 SDK 一并审阅的公开客户端和模型服务接口代际。
    "openai==3.29.0",
    "httpx2==2.12.0",
    # 构建不可变源码 wheel 前，先安装固定版本的构建后端。
    "hatchling==1.28.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
openai-agents = { path = "../sources/main" }
