[project]
name = "harness-lab-openai-agents-sdk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.24.0",
    # Match the public client/provider generation reviewed with the fixed SDK.
    "openai==3.29.0",
    "httpx2==2.12.0",
    # Install the pinned backend before building the immutable source wheel.
    "hatchling==1.28.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
openai-agents = { path = "../sources/main" }
