[project]
name = "harness-lab-google-adk"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk==2.12.0",
    "litellm==1.85.7",
    "openai==2.46.0",
    "google-genai==2.30.0",
    "httpx==0.28.1",
    "flit-core==3.12.0",
    # 详细用例的浏览器接入使用官方 MCP 客户端。
    "mcp==1.28.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
google-adk = { path = "../sources/main" }

# Exact base runtime metadata from the pinned source pyproject.toml. This
# avoids executing its dynamic-version build backend during host lock prep.
# Only LiteLLM is selected from extensions; other integrations are not used.
[[tool.uv.dependency-metadata]]
name = "google-adk"
version = "2.12.0"
requires-python = ">=3.11"
requires-dist = [
    "aiosqlite>=0.21",
    "authlib>=1.6.6,<2",
    "click>=8.1.8,<9",
    "cryptography>=42",
    "fastapi>=0.133,<1",
    "google-auth[pyopenssl]>=2.47",
    "google-genai>=2.30,<3",
    "graphviz>=0.20.2,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "opentelemetry-api>=1.39,<=1.44",
    "opentelemetry-sdk>=1.39,<=1.44",
    "packaging>=21",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32.4,<3",
    "starlette>=1.3.1,<2",
    "tenacity>=9,<10",
    "typing-extensions>=4.5,<5",
    "uvicorn>=0.34,<1",
    "watchdog>=6,<7",
    "websockets>=15.0.1,<16",
]
