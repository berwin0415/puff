[project]
name = "harness-lab-deepagents-langgraph"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.28",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-prebuilt==1.1.1",
    "langgraph-sdk==0.4.8",
    "langchain==1.4.6",
    "langchain-core==1.6.11",
    "langchain-openai==1.7.2",
    "httpx==0.28.1",
    # I19 浏览器变体使用官方 MCP SDK 的公开客户端 API。
    "mcp==1.28.1",
    # 构建六个本地包之前，先安装锁定的构建工具。
    "setuptools==83.0.0",
    "wheel==0.46.3",
    "hatchling==1.28.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
# 解析时匹配上游的传递路径声明；Docker 的
# --no-editable 从这些精确路径构建不可变的已安装 wheel。
deepagents = { path = "../sources/deepagents/libs/deepagents", editable = true }
langgraph = { path = "../sources/langgraph/libs/langgraph", editable = true }
langgraph-checkpoint = { path = "../sources/langgraph/libs/checkpoint", editable = true }
langgraph-checkpoint-sqlite = { path = "../sources/langgraph/libs/checkpoint-sqlite", editable = true }
langgraph-prebuilt = { path = "../sources/langgraph/libs/prebuilt", editable = true }
langgraph-sdk = { path = "../sources/langgraph/libs/sdk-py", editable = true }

# 这是精确固定的 SDK 源码元数据，供 uv 解析其动态版本，
# 无需在宿主机执行上游构建后端。镜像负责构建软件包，
# 校验器检查最终安装版本。
[[tool.uv.dependency-metadata]]
name = "langgraph-sdk"
version = "0.4.8"
requires-python = ">=3.10"
requires-dist = [
    "httpx>=0.25.2",
    "orjson>=3.11.5",
    "langchain-protocol>=0.0.15",
    "langchain-core>=1.4.0,<2",
    "websockets>=14,<17",
]
