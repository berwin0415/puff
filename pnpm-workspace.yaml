packages:
  - 'domains/*/apps/*'
  - 'domains/*/services/*'
  - 'domains/*/libs/*'
  - 'platform/libs/*'
  - 'platform/services/*'

# Third-party versions live here and nowhere else. Every package.json must
# reference them with "catalog:" so the whole repo resolves one version per
# dependency.
catalogMode: strict
catalog:
  '@biomejs/biome': 2.5.14
  '@deepseek-ai/dsh': 0.1.7-rc.2
  '@nestjs/cli': 12.0.7
  '@nestjs/common': 12.1.0
  '@nestjs/core': 12.1.0
  '@nestjs/mau': 0.2.8
  '@nestjs/platform-express': 12.1.0
  '@nestjs/schematics': 12.0.5
  '@nestjs/testing': 12.1.0
  '@rsbuild/core': 2.2.10
  '@rsbuild/plugin-react': 2.1.1
  '@types/express': 5.0.6
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/supertest': 7.2.1
  '@vitest/coverage-v8': 4.1.11
  concurrently: 10.0.5
  electron: 44.0.0
  electron-builder: 26.15.3
  electronmon: 2.0.4
  nx: 24.0.5
  pnpm: 11.7.0
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rimraf: 6.1.3
  rxjs: 7.8.1
  source-map-support: 0.5.21
  supertest: 7.3.0
  tsdown: 0.23.0
  typescript: 6.0.3
  vitest: 4.1.11

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  electron-winstaller: false
  esbuild: true
  koffi: true
  node-pty: true
  nx: true
  protobufjs: true

# pnpm waits before trusting a just-published version (supply-chain guard);
# only this exact version currently needs to bypass that wait.
minimumReleaseAgeExclude:
  - '@rsbuild/plugin-react@2.1.1'

# electron-builder 26.15 uses the cache-mode API introduced by @electron/get 5.
overrides:
  '@electron/get': 5.1.0
